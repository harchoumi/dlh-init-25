name: Docker Image CI
on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: docker pull
      run: |
        docker pull harchoumi/todolist
    - name: ls
      run: |
        ls
