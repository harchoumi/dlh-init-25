name: Build using Docker
on: 
  push:
    branches: [ "develop" ]
jobs:
  build_and_deploy_todolist:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: docker login
      env:
        DOCKER_USER: ${{secrets.DOCKER_USERNAME}}
        DOCKER_PASSWORD: ${{secrets.DOCKER_PASSWORD}}
      run: |
        docker login -u $DOCKER_USER -p $DOCKER_PASSWORD
    - name: build todo
      run: |
        docker build . --file Dockerfile --tag harchoumi/todolist:latest
    - name: Push
      run: |
        docker push harchoumi/todolist:latest
    - name: logout
      run: |
        docker logout
      
